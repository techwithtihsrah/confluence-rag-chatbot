services:
  backend:
    build:
      context: ./backend
    container_name: confluence-rag-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: confluence-rag-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
